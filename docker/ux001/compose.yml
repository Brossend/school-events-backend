name: school-ux001
services:
  app:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
    env_file: ${UX001_ENV_FILE:?Set UX001_ENV_FILE to a private local env file}
    environment: &practice-environment
      APP_ENV: local
      APP_DEBUG: 'false'
      APP_CONFIG_CACHE: /var/www/html/storage/framework/cache/ux001-config.php
      DB_URL: ''
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: school_events_ux001
      DB_USERNAME: school_ux001_app
      POSTGRES_USER: ''
      POSTGRES_PASSWORD: ''
      REDIS_URL: ''
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_USERNAME: 'null'
      REDIS_PASSWORD: 'null'
      REDIS_PREFIX: ux001_clean_
      SESSION_DRIVER: redis
      SESSION_CONNECTION: default
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      LLM_PROVIDER: mock
      MAIL_MAILER: log
    command: [sh, -c, "mkdir -p storage/app/private storage/framework/views storage/framework/sessions storage/framework/cache && chown -R www-data:www-data storage && exec php-fpm"]
    volumes:
      - ../..:/var/www/html
      - storage:/var/www/html/storage
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]
  worker:
    build:
      context: ../..
      dockerfile: docker/php/Dockerfile
    env_file: ${UX001_ENV_FILE:?required}
    environment: *practice-environment
    user: www-data
    command: [php, artisan, queue:work, redis, --tries=1, --timeout=840]
    volumes: ["../..:/var/www/html", "storage:/var/www/html/storage"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [private]
  nginx:
    image: nginx:alpine
    ports: ["127.0.0.1:8020:80"]
    volumes:
      - ../..:/var/www/html:ro
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [private, edge]
  postgres:
    image: postgres:16-alpine
    env_file: ${UX001_ENV_FILE:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-practice.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U school_ux001_owner -d postgres"]
      interval: 5s
      retries: 20
    networks: [private]
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
    volumes: [redis:/data]
    networks: [private]
networks:
  private: {internal: true}
  edge: {}
volumes:
  postgres: {}
  storage: {}
  redis: {}
