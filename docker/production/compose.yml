name: school-events
x-app: &app
  image: registry.gitlab.com/brossend2335/school-events-backend:${BACKEND_SHA:?required}
  env_file: /opt/school-events/secrets/backend.env
  restart: unless-stopped
  volumes: [storage:/var/www/html/storage]
  networks: [private]
  mem_limit: 384m
  logging: &logging
    driver: local
    options: {max-size: 10m, max-file: "3"}
services:
  app:
    <<: *app
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    command: [php, artisan, queue:work, redis, --sleep=2, --tries=1, --timeout=840, --max-time=3600]
    stop_grace_period: 900s
    depends_on: {app: {condition: service_healthy}}
    healthcheck:
      test: [CMD-SHELL, "kill -0 1"]
      interval: 15s
  frontend:
    image: registry.gitlab.com/brossend2335/school-events-frontend:${FRONTEND_SHA:?required}
    restart: unless-stopped
    environment: {NUXT_PUBLIC_API_ORIGIN: "https://school-events.ru"}
    networks: [private]
    mem_limit: 384m
    logging: *logging
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes: [./nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    networks: [private]
    depends_on: {app: {condition: service_healthy}}
    mem_limit: 64m
    logging: *logging
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1/api/v1/health]
      interval: 15s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16-alpine
    env_file: /opt/school-events/secrets/postgres.env
    restart: unless-stopped
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [private]
    mem_limit: 512m
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 192mb, --maxmemory-policy, noeviction]
    restart: unless-stopped
    volumes: [redis:/data]
    networks: [private]
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 20
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "127.0.0.1:8080:8080"]
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    networks: [private, public]
    mem_limit: 128m
    logging: *logging
networks:
  private:
    internal: true
    ipam:
      config: [{subnet: 172.30.40.0/24}]
  public: {}
volumes:
  postgres: {}
  redis: {}
  storage: {}
  caddy_data: {}
  caddy_config: {}
